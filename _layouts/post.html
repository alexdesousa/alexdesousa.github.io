{%- assign lang = page.lang | default: "en" -%}
<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="light">
  <head>
    {%- include main/head.html lang=lang -%}
  </head>
  <body class="bg-canvas text-ink font-mono">
    {%- include post/navigation.html lang=lang -%}
    {%- include post/header.html lang=lang -%}
    {%- include post/content.html lang=lang -%}
    {%- include main/footer.html lang=lang -%}
    <script>
      document.addEventListener('scroll', function() {
        var st = document.documentElement.scrollTop || document.body.scrollTop;
        var sh = document.documentElement.scrollHeight || document.body.scrollHeight;
        var scroll = st / (sh - document.documentElement.clientHeight) * 100;
        document.getElementById('progress-bar').style.setProperty('--scroll', scroll + '%');
      }, {passive: true});
      document.querySelectorAll('#post-content table').forEach(function(t) {
        var w = document.createElement('div');
        w.className = 'table-scroll';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
        t.style.margin = '0';
      });
    </script>
  </body>
</html>
