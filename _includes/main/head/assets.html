<link rel="stylesheet" href="/assets/css/tailwind.css"/>
<script>
  (function() {
    var stored = localStorage.getItem('tbl-theme');
    var mode = stored ? stored : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', mode);
  })();
  function toggleTheme() {
    var html = document.documentElement;
    var next = (html.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('tbl-theme', next);
  }
</script>
<script type="text/javascript" src="/assets/js/app.js"></script>
